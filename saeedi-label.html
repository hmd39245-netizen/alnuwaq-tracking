<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shipping Label</title>

<style>
*{
  box-sizing:border-box;
}

html,body{
  margin:0;
  padding:0;
  background:#ece9e5;
  font-family:Tahoma, Arial, sans-serif;
  color:#140d09;
}

.toolbar{
  background:#fff;
  text-align:center;
  padding:10px;
  position:sticky;
  top:0;
  z-index:100;
}

.print-btn{
  border:0;
  background:#342015;
  color:#fff;
  padding:11px 25px;
  border-radius:8px;
  font-family:Tahoma, Arial, sans-serif;
  font-size:14px;
  font-weight:700;
  cursor:pointer;
}

#app{
  width:4in;
  margin:15px auto;
}

.label{
  position:relative;
  width:4in;
  height:6in;
  background:#fffdf9;
  overflow:hidden;
  margin-bottom:18px;
  border:2px solid #3b261b;
  border-radius:11px;
  page-break-after:always;
}

/* =========================
   HEADER
========================= */

.packageBlock{
  position:absolute;
  left:14px;
  top:14px;
  width:88px;
  height:92px;
  border:2px solid #3c281d;
  border-radius:8px;
  background:#f6eee4;
  text-align:center;
}

.packageIcon{
  margin-top:9px;
  font-size:23px;
  line-height:1;
  color:#473027;
}

.packageCount{
  direction:ltr;
  font-family:Tahoma, Arial, sans-serif;
  font-size:27px;
  font-weight:700;
  margin-top:4px;
  line-height:1;
}

.headerDivider{
  position:absolute;
  left:112px;
  top:19px;
  width:1px;
  height:82px;
  background:#aa805f;
}

.brand{
  position:absolute;
  right:20px;
  top:29px;
  font-family:Tahoma, Arial, sans-serif;
  font-size:26px;
  font-weight:700;
  color:#291a13;
}

.carrier{
  position:absolute;
  right:20px;
  top:69px;
  font-family:Tahoma, Arial, sans-serif;
  font-size:13px;
  font-weight:700;
  color:#3b2b23;
}

/* =========================
   MAIN DIVIDER
========================= */

.lineBrown{
  position:absolute;
  left:16px;
  top:118px;
  width:39px;
  height:4px;
  border-radius:5px;
  background:#a77d5c;
}

.lineBlack{
  position:absolute;
  left:59px;
  right:16px;
  top:118px;
  height:4px;
  border-radius:5px;
  background:#36271f;
}

/* =========================
   ORDER
========================= */

.orderBox{
  position:absolute;
  left:15px;
  right:15px;
  top:136px;
  height:60px;
  border:2px solid #3a281e;
  border-radius:8px;
  background:#faf5ee;
}

.orderIcon{
  position:absolute;
  right:8px;
  top:10px;
  width:38px;
  height:38px;
  background:#825635;
  border-radius:5px;
  color:white;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:18px;
}

.orderLabel{
  position:absolute;
  right:57px;
  top:21px;
  font-family:Tahoma, Arial, sans-serif;
  font-size:12px;
  font-weight:700;
}

.orderNumber{
  position:absolute;
  left:20px;
  right:120px;
  top:15px;
  text-align:center;
  direction:ltr;
  font-family:Tahoma, Arial, sans-serif;
  font-size:20px;
  font-weight:700;
}

/* =========================
   INFO GRID
========================= */

.card{
  position:absolute;
  border:1.8px solid #3b281e;
  border-radius:8px;
  overflow:hidden;
  background:white;
}

.cardHeader{
  height:31px;
  background:#f5ecdf;
  border-bottom:1px solid #d9c6b4;
  display:flex;
  align-items:center;
  padding-right:41px;
  font-family:Tahoma, Arial, sans-serif;
  font-size:11px;
  font-weight:700;
}

.cardIcon{
  position:absolute;
  right:0;
  top:0;
  width:34px;
  height:31px;
  background:#875a38;
  color:white;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:16px;
}

.cardValue{
  height:43px;
  display:flex;
  align-items:center;
  padding:5px 10px;
  font-family:Tahoma, Arial, sans-serif;
  font-size:15px;
  font-weight:700;
  line-height:1.2;
}

/* CUSTOMER */

.customer{
  right:15px;
  top:208px;
  width:171px;
  height:75px;
}

.phone{
  left:15px;
  top:208px;
  width:171px;
  height:75px;
}

/* CITY */

.city{
  right:15px;
  top:292px;
  width:171px;
  height:75px;
}

.company{
  left:15px;
  top:292px;
  width:171px;
  height:75px;
}

/* PRODUCT */

.product{
  left:15px;
  right:15px;
  top:376px;
  height:78px;
}

.product .cardValue{
  font-size:15px;
  font-weight:700;
}

/* STATUS */

.status{
  left:15px;
  right:15px;
  top:463px;
  height:82px;
}

.status .cardValue{
  font-size:22px;
  font-weight:700;
}

.watermark{
  position:absolute;
  left:18px;
  bottom:1px;
  font-size:48px;
  opacity:0.08;
}

/* =========================
   FOOTER
========================= */

.footerBrown{
  position:absolute;
  left:16px;
  bottom:38px;
  width:39px;
  height:4px;
  background:#a77d5c;
  border-radius:5px;
}

.footerBlack{
  position:absolute;
  left:59px;
  right:16px;
  bottom:38px;
  height:4px;
  background:#36271f;
  border-radius:5px;
}

.footerPackage{
  position:absolute;
  left:18px;
  bottom:13px;
  direction:ltr;
  font-family:Tahoma, Arial, sans-serif;
  font-size:13px;
  font-weight:700;
}

.footerBrand{
  position:absolute;
  right:18px;
  bottom:11px;
  font-family:Tahoma, Arial, sans-serif;
  font-size:13px;
  font-weight:700;
}

/* =========================
   PRINT
========================= */

@media print{

  @page{
    size:4in 6in;
    margin:0;
  }

  html,
  body{
    width:4in;
    margin:0;
    padding:0;
    background:#fff;
  }

  .toolbar{
    display:none !important;
  }

  #app{
    width:4in;
    margin:0;
  }

  .label{
    width:4in;
    height:6in;
    margin:0;
    border-radius:0;
    break-after:page;
    page-break-after:always;
  }

  .label:last-child{
    break-after:auto;
    page-break-after:auto;
  }
}

.error{
  background:#fff;
  padding:25px;
  text-align:center;
  font-family:Tahoma, Arial, sans-serif;
}
</style>
</head>

<body>

<div class="toolbar">
  <button
    class="print-btn"
    onclick="window.print()">
    طباعة البوالص
  </button>
</div>

<main id="app">
جاري تحميل البوالص...
</main>

<script>
async function loadLabels(){

  const params =
    new URLSearchParams(
      window.location.search
    );

  const order =
    params.get("order");

  const app =
    document.getElementById("app");

  if(!order){

    app.innerHTML =
      '<div class="error">رقم الطلب غير موجود</div>';

    return;
  }

  try{

    const response =
      await fetch(
        `/api/saeedi-label?order=${encodeURIComponent(order)}`
      );

    const data =
      await response.json();

    if(!response.ok || !data.ok){

      app.innerHTML =
        `<div class="error">${
          escapeHtml(
            data.error ||
            "تعذر تحميل البوليصة"
          )
        }</div>`;

      return;
    }

    app.innerHTML = "";

    data.labels.forEach(label=>{

      const el =
        document.createElement("section");

      el.className =
        "label";

      el.innerHTML = `

        <div class="packageBlock">

          <div class="packageIcon">
            📦
          </div>

          <div class="packageCount">
            ${escapeHtml(label.package)}
          </div>

        </div>

        <div class="headerDivider"></div>

        <div class="brand">
          النواق
        </div>

        <div class="carrier">
          الناقل: الصاعدي
        </div>

        <div class="lineBrown"></div>
        <div class="lineBlack"></div>


        <div class="orderBox">

          <div class="orderIcon">
            ▣
          </div>

          <div class="orderLabel">
            رقم الطلب:
          </div>

          <div class="orderNumber">
            ${escapeHtml(label.orderNumber)}
          </div>

        </div>


        <div class="card customer">

          <div class="cardIcon">
            👤
          </div>

          <div class="cardHeader">
            اسم العميل
          </div>

          <div class="cardValue">
            ${escapeHtml(
              label.customerName || "-"
            )}
          </div>

        </div>


        <div class="card phone">

          <div class="cardIcon">
            ☎
          </div>

          <div class="cardHeader">
            رقم الجوال
          </div>

          <div
            class="cardValue"
            dir="ltr">

            ${escapeHtml(
              label.mobile || "-"
            )}

          </div>

        </div>


        <div class="card city">

          <div class="cardIcon">
            ●
          </div>

          <div class="cardHeader">
            المدينة
          </div>

          <div class="cardValue">
            ${escapeHtml(
              label.city || "-"
            )}
          </div>

        </div>


        <div class="card company">

          <div class="cardIcon">
            🚚
          </div>

          <div class="cardHeader">
            شركة الشحن
          </div>

          <div class="cardValue">
            الصاعدي
          </div>

        </div>


        <div class="card product">

          <div class="cardIcon">
            📦
          </div>

          <div class="cardHeader">
            محتوى الشحنة
          </div>

          <div class="cardValue">

            ${escapeHtml(
              label.product || "-"
            )}

          </div>

        </div>


        <div class="card status">

          <div class="cardIcon">
            ▤
          </div>

          <div class="cardHeader">
            حالة الشحن
          </div>

          <div class="cardValue">
            مدفوع
          </div>

          <div class="watermark">
            📦
          </div>

        </div>


        <div class="footerBrown"></div>
        <div class="footerBlack"></div>

        <div class="footerPackage">
          ${escapeHtml(label.package)}
        </div>

        <div class="footerBrand">
          النواق
        </div>

      `;

      app.appendChild(el);

    });

  }catch(error){

    app.innerHTML =
      '<div class="error">حدث خطأ أثناء تحميل البوليصة</div>';

  }

}

function escapeHtml(value){

  return String(value || "")

    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}

loadLabels();
</script>

</body>
</html>
