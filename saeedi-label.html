<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>بوليصة الصاعدي</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #ececec;
      font-family: Arial, sans-serif;
      color: #111;
    }

    .toolbar {
      position: sticky;
      top: 0;
      z-index: 20;
      background: #fff;
      padding: 12px;
      text-align: center;
      border-bottom: 1px solid #ccc;
    }

    .print-btn {
      border: 0;
      background: #111;
      color: #fff;
      font-size: 16px;
      font-weight: 700;
      padding: 12px 26px;
      border-radius: 8px;
      cursor: pointer;
    }

    .container {
      max-width: 900px;
      margin: 24px auto;
    }

    .label {
      width: 100%;
      background: #fff;
      border: 2px solid #111;
      margin-bottom: 24px;
      padding: 26px;
      page-break-after: always;
    }

    .top {
      display: grid;
      grid-template-columns: 180px 1fr;
      gap: 24px;
      align-items: stretch;
      border-bottom: 4px solid #111;
      padding-bottom: 18px;
      margin-bottom: 18px;
    }

    .piece-box {
      border: 4px solid #111;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 54px;
      font-weight: 900;
      min-height: 130px;
    }

    .brand-area {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: flex-start;
    }

    .brand {
      font-size: 34px;
      font-weight: 900;
      margin-bottom: 8px;
    }

    .carrier {
      font-size: 22px;
      font-weight: 700;
    }

    .order-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 2px solid #111;
      padding: 14px 0;
      margin-bottom: 18px;
      gap: 20px;
    }

    .order-title {
      font-size: 18px;
      font-weight: 700;
    }

    .order-number {
      font-size: 32px;
      font-weight: 900;
      letter-spacing: 1px;
    }

    .info-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .box {
      border: 2px solid #111;
      padding: 14px;
      min-height: 92px;
    }

    .box.full {
      grid-column: 1 / -1;
    }

    .box-title {
      font-size: 13px;
      font-weight: 700;
      color: #555;
      margin-bottom: 8px;
    }

    .box-value {
      font-size: 23px;
      font-weight: 800;
    }

    .paid {
      font-size: 38px;
      font-weight: 900;
    }

    .shipment-content {
      font-size: 28px;
      font-weight: 900;
    }

    .footer {
      margin-top: 18px;
      padding-top: 14px;
      border-top: 3px solid #111;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 18px;
      font-weight: 800;
    }

    .footer-piece {
      font-size: 26px;
      font-weight: 900;
    }

    .error {
      background: #fff;
      border: 1px solid #ccc;
      padding: 30px;
      text-align: center;
      margin: 30px;
    }

    @media print {
      @page {
        size: A4;
        margin: 10mm;
      }

      body {
        background: #fff;
      }

      .toolbar {
        display: none !important;
      }

      .container {
        max-width: none;
        margin: 0;
      }

      .label {
        margin: 0;
        border: 2px solid #111;
        break-after: page;
        page-break-after: always;
        min-height: 270mm;
      }

      .label:last-child {
        break-after: auto;
        page-break-after: auto;
      }
    }

    @media (max-width: 700px) {
      .top {
        grid-template-columns: 1fr;
      }

      .info-grid {
        grid-template-columns: 1fr;
      }

      .box.full {
        grid-column: auto;
      }

      .order-row {
        flex-direction: column;
        align-items: flex-start;
      }
    }
  </style>
</head>

<body>

  <div class="toolbar">
    <button class="print-btn" onclick="window.print()">
      طباعة البوالص
    </button>
  </div>

  <main id="app" class="container">
    جاري تحميل البوالص...
  </main>

  <script>
    async function loadLabels() {
      const params = new URLSearchParams(window.location.search);
      const order = params.get("order");
      const app = document.getElementById("app");

      if (!order) {
        app.innerHTML =
          '<div class="error">رقم الطلب غير موجود</div>';
        return;
      }

      try {
        const response = await fetch(
          `/api/saeedi-label?order=${encodeURIComponent(order)}`
        );

        const data = await response.json();

        if (!response.ok || !data.ok) {
          app.innerHTML =
            `<div class="error">${escapeHtml(data.error || "تعذر تحميل البوالص")}</div>`;
          return;
        }

        app.innerHTML = "";

        data.labels.forEach(label => {
          const section = document.createElement("section");
          section.className = "label";

          section.innerHTML = `
            <div class="top">
              <div class="piece-box">
                ${escapeHtml(label.package)}
              </div>

              <div class="brand-area">
                <div class="brand">متجر النواق</div>
                <div class="carrier">الناقل: الصاعدي</div>
              </div>
            </div>

            <div class="order-row">
              <div class="order-title">رقم الطلب</div>
              <div class="order-number">
                ${escapeHtml(label.orderNumber)}
              </div>
            </div>

            <div class="info-grid">
              <div class="box">
                <div class="box-title">اسم العميل</div>
                <div class="box-value">
                  ${escapeHtml(label.customerName || "-")}
                </div>
              </div>

              <div class="box">
                <div class="box-title">رقم الجوال</div>
                <div class="box-value">
                  ${escapeHtml(label.mobile || "-")}
                </div>
              </div>

              <div class="box">
                <div class="box-title">المدينة</div>
                <div class="box-value">
                  ${escapeHtml(label.city || "-")}
                </div>
              </div>

              <div class="box">
                <div class="box-title">شركة الشحن</div>
                <div class="box-value">الصاعدي</div>
              </div>

              <div class="box full">
                <div class="box-title">محتوى الشحنة</div>
                <div class="shipment-content">
                  ${escapeHtml(label.product || "-")}
                </div>
              </div>

              <div class="box full">
                <div class="box-title">حالة الشحن</div>
                <div class="paid">مدفوع</div>
              </div>
            </div>

            <div class="footer">
              <span>متجر النواق</span>
              <span class="footer-piece">
                ${escapeHtml(label.package)}
              </span>
            </div>
          `;

          app.appendChild(section);
        });

      } catch (error) {
        app.innerHTML =
          '<div class="error">حدث خطأ أثناء تحميل البوالص</div>';
      }
    }

    function escapeHtml(value) {
      return String(value || "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    loadLabels();
  </script>

</body>
</html>
