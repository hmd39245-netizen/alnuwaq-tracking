<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Shipping Label</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      background: #ecebea;
      font-family: Arial, Tahoma, sans-serif;
      color: #140d09;
    }

    .toolbar {
      background: white;
      text-align: center;
      padding: 10px;
      position: sticky;
      top: 0;
      z-index: 20;
      border-bottom: 1px solid #ddd;
    }

    .print-btn {
      border: 0;
      background: #2b190f;
      color: white;
      padding: 10px 24px;
      border-radius: 8px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
    }

    #app {
      width: 4in;
      margin: 16px auto;
    }

    .shipping-label {
      width: 4in;
      height: 6in;
      background: #fff;
      border: 2px solid #24150e;
      border-radius: 10px;
      padding: 0.11in;
      overflow: hidden;
      margin-bottom: 18px;
      page-break-after: always;
    }

    .header {
      display: grid;
      grid-template-columns: 0.92in 1px 1fr;
      gap: 0.11in;
      align-items: center;
      min-height: 1.08in;
    }

    .package-box {
      height: 0.93in;
      border: 2px solid #2c1a10;
      border-radius: 8px;
      background: linear-gradient(135deg, #faf5ee, #f3e8d8);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      direction: ltr;
    }

    .package-icon {
      font-size: 23px;
      line-height: 1;
      margin-bottom: 3px;
    }

    .package-count {
      font-size: 27px;
      font-weight: 900;
      line-height: 1;
    }

    .vertical-line {
      height: 0.85in;
      background: #8a5c38;
      width: 1px;
    }

    .brand-area {
      text-align: right;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .brand-row {
      display: flex;
      justify-content: flex-start;
      align-items: center;
    }

    .brand-name {
      font-size: 28px;
      font-weight: 900;
      color: #24140d;
    }

    .carrier-name {
      font-size: 14px;
      font-weight: 700;
      margin-top: 4px;
    }

    .divider {
      margin: 0.08in 0 0.10in;
      display: flex;
      gap: 3px;
      direction: ltr;
    }

    .divider .short {
      width: 0.38in;
      height: 3px;
      background: #9b6a3d;
      border-radius: 10px;
    }

    .divider .long {
      flex: 1;
      height: 3px;
      background: #2c211d;
      border-radius: 10px;
    }

    .order-box {
      border: 1.7px solid #2b190f;
      border-radius: 7px;
      background: linear-gradient(90deg, #fff 0%, #faf5ef 100%);
      min-height: 0.62in;
      display: grid;
      grid-template-columns: 1fr auto auto;
      align-items: center;
      gap: 7px;
      padding: 0.07in;
      margin-bottom: 0.08in;
    }

    .order-number {
      font-size: 20px;
      font-weight: 900;
      direction: ltr;
      text-align: center;
    }

    .order-title {
      font-size: 13px;
      font-weight: 700;
      white-space: nowrap;
    }

    .icon-box {
      width: 0.32in;
      height: 0.32in;
      background: linear-gradient(135deg, #8a5a34, #56301c);
      border-radius: 5px;
      color: white;
      display: grid;
      place-items: center;
      font-size: 16px;
    }

    .info-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.07in;
    }

    .info-card {
      border: 1.5px solid #2b190f;
      border-radius: 7px;
      overflow: hidden;
      background: white;
      min-height: 0.74in;
    }

    .info-head {
      background: linear-gradient(90deg, #fff 0%, #f5ecdf 100%);
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 5px;
      align-items: center;
      padding: 0.045in 0.055in;
      min-height: 0.30in;
    }

    .info-title {
      font-size: 11px;
      font-weight: 700;
    }

    .info-value {
      min-height: 0.38in;
      display: flex;
      align-items: center;
      justify-content: flex-start;
      padding: 0.04in 0.065in;
      font-size: 15px;
      font-weight: 900;
    }

    .full-card {
      grid-column: 1 / -1;
    }

    .product-value {
      font-size: 16px;
    }

    .paid-value {
      font-size: 25px;
      font-weight: 900;
    }

    .status-card {
      position: relative;
      overflow: hidden;
    }

    .watermark {
      position: absolute;
      left: 8px;
      bottom: 2px;
      font-size: 50px;
      opacity: 0.08;
      direction: ltr;
    }

    .footer-divider {
      margin-top: 0.08in;
      display: flex;
      gap: 3px;
      direction: ltr;
    }

    .footer-divider .short {
      width: 0.38in;
      height: 3px;
      background: #9b6a3d;
    }

    .footer-divider .long {
      flex: 1;
      height: 3px;
      background: #2c211d;
    }

    .footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      direction: ltr;
      margin-top: 0.04in;
      font-weight: 900;
    }

    .footer-package {
      font-size: 14px;
    }

    .footer-brand {
      direction: rtl;
      font-size: 12px;
      display: flex;
      align-items: center;
    }

    .error {
      background: white;
      padding: 30px;
      text-align: center;
    }

    @media print {
      @page {
        size: 4in 6in;
        margin: 0;
      }

      html,
      body {
        width: 4in;
        margin: 0;
        padding: 0;
        background: white;
      }

      .toolbar {
        display: none !important;
      }

      #app {
        width: 4in;
        margin: 0;
      }

      .shipping-label {
        width: 4in;
        height: 6in;
        margin: 0;
        border-radius: 0;
        page-break-after: always;
        break-after: page;
      }

      .shipping-label:last-child {
        page-break-after: auto;
        break-after: auto;
      }
    }
  </style>
</head>

<body>

  <div class="toolbar">
    <button class="print-btn" onclick="window.print()">
      طباعة البوالص
    </button>
  </div>

  <main id="app">
    جاري تحميل البوالص...
  </main>

  <script>
    async function loadLabels() {
      const params = new URLSearchParams(window.location.search);
      const order = params.get("order");
      const app = document.getElementById("app");

      if (!order) {
        app.innerHTML =
          '<div class="error">رقم الطلب غير موجود</div>';
        return;
      }

      try {
        const response = await fetch(
          `/api/saeedi-label?order=${encodeURIComponent(order)}`
        );

        const data = await response.json();

        if (!response.ok || !data.ok) {
          app.innerHTML =
            `<div class="error">${escapeHtml(data.error || "تعذر تحميل البوالص")}</div>`;
          return;
        }

        app.innerHTML = "";

        data.labels.forEach(label => {
          const section = document.createElement("section");

          section.className = "shipping-label";

          section.innerHTML = `
            <div class="header">

              <div class="package-box">
                <div class="package-icon">⬡</div>
                <div class="package-count">
                  ${escapeHtml(label.package)}
                </div>
              </div>

              <div class="vertical-line"></div>

              <div class="brand-area">
                <div class="brand-row">
                  <div class="brand-name">النواق</div>
                </div>

                <div class="carrier-name">
                  الناقل: الصاعدي
                </div>
              </div>

            </div>

            <div class="divider">
              <span class="short"></span>
              <span class="long"></span>
            </div>

            <div class="order-box">

              <div class="order-number">
                ${escapeHtml(label.orderNumber)}
              </div>

              <div class="order-title">
                رقم الطلب:
              </div>

              <div class="icon-box">
                ▣
              </div>

            </div>

            <div class="info-grid">

              <div class="info-card">
                <div class="info-head">
                  <div class="info-title">رقم الجوال</div>
                  <div class="icon-box">▯</div>
                </div>

                <div class="info-value" dir="ltr">
                  ${escapeHtml(label.mobile || "-")}
                </div>
              </div>

              <div class="info-card">
                <div class="info-head">
                  <div class="info-title">اسم العميل</div>
                  <div class="icon-box">●</div>
                </div>

                <div class="info-value">
                  ${escapeHtml(label.customerName || "-")}
                </div>
              </div>

              <div class="info-card">
                <div class="info-head">
                  <div class="info-title">شركة الشحن</div>
                  <div class="icon-box">▰</div>
                </div>

                <div class="info-value">
                  الصاعدي
                </div>
              </div>

              <div class="info-card">
                <div class="info-head">
                  <div class="info-title">المدينة</div>
                  <div class="icon-box">●</div>
                </div>

                <div class="info-value">
                  ${escapeHtml(label.city || "-")}
                </div>
              </div>

              <div class="info-card full-card">
                <div class="info-head">
                  <div class="info-title">محتوى الشحنة</div>
                  <div class="icon-box">⬡</div>
                </div>

                <div class="info-value product-value">
                  ${escapeHtml(label.product || "-")}
                </div>
              </div>

              <div class="info-card full-card status-card">
                <div class="info-head">
                  <div class="info-title">حالة الشحن</div>
                  <div class="icon-box">▤</div>
                </div>

                <div class="info-value paid-value">
                  مدفوع
                </div>

                <div class="watermark">
                  📦 ➜
                </div>
              </div>

            </div>

            <div class="footer-divider">
              <span class="short"></span>
              <span class="long"></span>
            </div>

            <div class="footer">

              <div class="footer-package">
                ${escapeHtml(label.package)}
              </div>

              <div class="footer-brand">
                <span>النواق</span>
              </div>

            </div>
          `;

          app.appendChild(section);
        });

      } catch (error) {
        app.innerHTML =
          '<div class="error">حدث خطأ أثناء تحميل البوليصة</div>';
      }
    }

    function escapeHtml(value) {
      return String(value || "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    loadLabels();
  </script>

</body>
</html>
