<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Shipping Label</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      background: #e9e9e9;
      font-family: Arial, sans-serif;
      color: #111;
    }

    .toolbar {
      padding: 12px;
      text-align: center;
      background: #fff;
      border-bottom: 1px solid #ccc;
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .print-btn {
      border: 0;
      background: #111;
      color: #fff;
      padding: 11px 24px;
      border-radius: 7px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
    }

    .container {
      width: 4in;
      margin: 18px auto;
    }

    .label {
      width: 4in;
      height: 6in;
      background: #fff;
      border: 1.5px solid #111;
      padding: 0.13in;
      margin: 0 auto 18px;
      overflow: hidden;
      page-break-after: always;
      display: flex;
      flex-direction: column;
    }

    .top {
      display: grid;
      grid-template-columns: 0.8in 1fr;
      gap: 0.1in;
      align-items: stretch;
      border-bottom: 2px solid #111;
      padding-bottom: 0.09in;
      margin-bottom: 0.09in;
    }

    .piece-box {
      border: 2.5px solid #111;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 27px;
      font-weight: 900;
      min-height: 0.72in;
    }

    .brand-area {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: flex-start;
    }

    .brand {
      font-size: 20px;
      font-weight: 900;
    }

    .carrier {
      font-size: 13px;
      font-weight: 700;
      margin-top: 4px;
    }

    .order-row {
      border-bottom: 1.5px solid #111;
      padding: 0.06in 0 0.08in;
      margin-bottom: 0.08in;
    }

    .order-title {
      font-size: 9px;
      font-weight: 700;
      color: #555;
      margin-bottom: 2px;
    }

    .order-number {
      font-size: 22px;
      font-weight: 900;
      direction: ltr;
      text-align: right;
    }

    .info-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.055in;
    }

    .box {
      border: 1.2px solid #111;
      padding: 0.06in;
      min-height: 0.55in;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .box.full {
      grid-column: 1 / -1;
    }

    .box-title {
      font-size: 8px;
      font-weight: 700;
      color: #555;
      margin-bottom: 3px;
    }

    .box-value {
      font-size: 13px;
      font-weight: 800;
      line-height: 1.2;
      word-break: break-word;
    }

    .shipment-content {
      font-size: 15px;
      font-weight: 900;
      line-height: 1.25;
    }

    .paid {
      font-size: 21px;
      font-weight: 900;
    }

    .footer {
      margin-top: auto;
      border-top: 1.5px solid #111;
      padding-top: 0.07in;
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 10px;
      font-weight: 800;
    }

    .footer-piece {
      font-size: 14px;
      font-weight: 900;
    }

    .error {
      background: #fff;
      padding: 30px;
      text-align: center;
      border: 1px solid #ccc;
    }

    @media print {
      @page {
        size: 4in 6in;
        margin: 0;
      }

      html,
      body {
        width: 4in;
        margin: 0;
        padding: 0;
        background: #fff;
      }

      .toolbar {
        display: none !important;
      }

      .container {
        width: 4in;
        margin: 0;
      }

      .label {
        width: 4in;
        height: 6in;
        margin: 0;
        padding: 0.13in;
        border: none;
        page-break-after: always;
        break-after: page;
      }

      .label:last-child {
        page-break-after: auto;
        break-after: auto;
      }
    }
  </style>
</head>

<body>

  <div class="toolbar">
    <button class="print-btn" onclick="window.print()">
      طباعة البوالص
    </button>
  </div>

  <main id="app" class="container">
    جاري تحميل البوالص...
  </main>

  <script>
    async function loadLabels() {
      const params = new URLSearchParams(window.location.search);
      const order = params.get("order");
      const app = document.getElementById("app");

      if (!order) {
        app.innerHTML =
          '<div class="error">رقم الطلب غير موجود</div>';
        return;
      }

      try {
        const response = await fetch(
          `/api/saeedi-label?order=${encodeURIComponent(order)}`
        );

        const data = await response.json();

        if (!response.ok || !data.ok) {
          app.innerHTML =
            `<div class="error">${escapeHtml(data.error || "تعذر تحميل البوالص")}</div>`;
          return;
        }

        app.innerHTML = "";

        data.labels.forEach(label => {
          const section = document.createElement("section");
          section.className = "label";

          section.innerHTML = `
            <div class="top">

              <div class="piece-box">
                ${escapeHtml(label.package)}
              </div>

              <div class="brand-area">
                <div class="brand">متجر النواق</div>
                <div class="carrier">الناقل: الصاعدي</div>
              </div>

            </div>

            <div class="order-row">
              <div class="order-title">رقم الطلب</div>

              <div class="order-number">
                ${escapeHtml(label.orderNumber)}
              </div>
            </div>

            <div class="info-grid">

              <div class="box">
                <div class="box-title">اسم العميل</div>
                <div class="box-value">
                  ${escapeHtml(label.customerName || "-")}
                </div>
              </div>

              <div class="box">
                <div class="box-title">رقم الجوال</div>
                <div class="box-value">
                  ${escapeHtml(label.mobile || "-")}
                </div>
              </div>

              <div class="box">
                <div class="box-title">المدينة</div>
                <div class="box-value">
                  ${escapeHtml(label.city || "-")}
                </div>
              </div>

              <div class="box">
                <div class="box-title">شركة الشحن</div>
                <div class="box-value">الصاعدي</div>
              </div>

              <div class="box full">
                <div class="box-title">محتوى الشحنة</div>
                <div class="shipment-content">
                  ${escapeHtml(label.product || "-")}
                </div>
              </div>

              <div class="box full">
                <div class="box-title">حالة الشحن</div>
                <div class="paid">مدفوع</div>
              </div>

            </div>

            <div class="footer">
              <span>متجر النواق</span>

              <span class="footer-piece">
                ${escapeHtml(label.package)}
              </span>
            </div>
          `;

          app.appendChild(section);
        });

      } catch (error) {
        app.innerHTML =
          '<div class="error">حدث خطأ أثناء تحميل البوالص</div>';
      }
    }

    function escapeHtml(value) {
      return String(value || "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    loadLabels();
  </script>

</body>
</html>
